<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}ApplyAgent{% endblock %}</title>
    <!-- No JS build step: Tailwind (Play CDN), HTMX 2, Alpine.js 3 via CDN only. -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      ::selection {
        background: #c7d2fe;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-indigo-50 via-slate-50 to-fuchsia-50 bg-fixed text-slate-900 antialiased"
  >
    <nav class="sticky top-0 z-10 border-b border-slate-200/60 bg-white/70 backdrop-blur">
      <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-3">
        <a
          href="{% url 'core:dashboard' %}"
          class="bg-gradient-to-r from-indigo-600 via-violet-600 to-fuchsia-600 bg-clip-text text-lg font-extrabold tracking-tight text-transparent"
          >ApplyAgent</a
        >
        {% if user.is_authenticated %}
          <div class="flex items-center gap-4 text-sm">
            <a href="{% url 'core:dashboard' %}" class="font-medium text-slate-600 transition hover:text-indigo-600"
              >Dashboard</a
            >
            <a href="{% url 'core:profile' %}" class="font-medium text-slate-600 transition hover:text-indigo-600"
              >My profile</a
            >
            <a
              href="{% url 'core:job_new' %}"
              class="rounded-lg bg-gradient-to-r from-indigo-600 to-violet-600 px-3 py-1.5 font-semibold text-white shadow-md shadow-indigo-600/20 transition hover:brightness-110"
              >Paste a job</a
            >
            <span class="text-slate-400">{{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button
                type="submit"
                class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-slate-600 shadow-sm transition hover:bg-slate-50"
              >
                Log out
              </button>
            </form>
          </div>
        {% else %}
          <div class="flex items-center gap-4 text-sm">
            <a href="{% url 'login' %}" class="font-medium text-slate-600 transition hover:text-indigo-600"
              >Log in</a
            >
            <a
              href="{% url 'register' %}"
              class="rounded-lg bg-gradient-to-r from-indigo-600 to-violet-600 px-3 py-1.5 font-semibold text-white shadow-md shadow-indigo-600/20 transition hover:brightness-110"
              >Register</a
            >
          </div>
        {% endif %}
      </div>
    </nav>
    <main class="mx-auto max-w-4xl px-4 py-8">
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for message in messages %}
            <div
              class="rounded-xl border px-4 py-3 text-sm shadow-sm backdrop-blur {% if message.tags == 'error' %}border-red-200 bg-red-50/90 text-red-800{% elif message.tags == 'success' %}border-emerald-200 bg-emerald-50/90 text-emerald-800{% else %}border-indigo-200 bg-indigo-50/90 text-indigo-800{% endif %}"
            >
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
