{% extends "base.html" %}
{% block title %}Reset link sent — ApplyAgent{% endblock %}
{% block content %}
  <h1 class="mb-4 text-2xl font-bold">Check your inbox</h1>
  <div class="max-w-md rounded border border-slate-200 bg-white p-6 shadow-sm">
    <p class="text-sm">
      If an account exists for that address, we've sent a password reset link.
      It expires after a short time and works once.
    </p>
    <p class="mt-4 text-sm text-slate-500"><a href="{% url 'login' %}" class="underline">Back to log in</a></p>
  </div>
{% endblock %}
