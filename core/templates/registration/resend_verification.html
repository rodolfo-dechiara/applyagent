{% extends "base.html" %}
{% block title %}Resend verification — ApplyAgent{% endblock %}
{% block content %}
  <div class="mx-auto w-full max-w-md">
    <h1
      class="bg-gradient-to-r from-indigo-600 via-violet-600 to-fuchsia-600 bg-clip-text text-center text-2xl font-extrabold sm:text-3xl tracking-tight text-transparent"
    >
      Resend verification link
    </h1>
    <form
      method="post"
      class="mt-6 space-y-4 rounded-2xl border border-slate-200/70 bg-white/80 p-6 shadow-xl shadow-indigo-600/5 backdrop-blur"
    >
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label class="mb-1 block text-sm font-semibold text-slate-700" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<p class="mt-1 text-sm text-red-600">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
      <button
        type="submit"
        class="w-full rounded-lg bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-600/25 transition hover:brightness-110"
      >
        Send link
      </button>
    </form>
    <p class="mt-4 text-center text-sm text-slate-500">
      <a href="{% url 'login' %}" class="text-indigo-600 hover:underline">Back to log in</a>
    </p>
  </div>
{% endblock %}
