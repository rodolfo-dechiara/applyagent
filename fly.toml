# Fly.io deployment config for You're Hired.
# Deploy with:  fly auth login && fly apps create applyagents && \
#   fly volumes create data --size 1 --region fra && \
#   fly secrets set DJANGO_SECRET_KEY="$(openssl rand -hex 32)" && \
#   fly deploy
# If the app name "applyagent" is taken, pick another and update
# `app` below plus the two DJANGO_* URLs in [env] (the app answers on
# https://<app>.fly.dev).
app = "applyagents"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "False"
  # Custom domain (youre-hired.eu) plus the fly.dev fallback.
  DJANGO_ALLOWED_HOSTS = "applyagents.fly.dev,youre-hired.eu,www.youre-hired.eu"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://applyagents.fly.dev,https://youre-hired.eu,https://www.youre-hired.eu"
  # SQLite lives on the mounted volume, not in the ephemeral image fs.
  APPLYAGENT_DB = "/data/db.sqlite3"
  # MISTRAL_API_KEY is set via `fly secrets set` (optional: demo mode without it).
  # Outbound email goes to the relay-only Postfix app over Fly's private
  # network (no inbound ports open; it egresses via its dedicated IPv4 and
  # signs DKIM for youre-hired.eu).
  EMAIL_HOST = "applyagent-mail.internal"
  EMAIL_PORT = "25"
  EMAIL_USE_TLS = "false"
  DEFAULT_FROM_EMAIL = "You're Hired <noreply@youre-hired.eu>"

[processes]
  # No release_command: a Fly volume attaches to a single machine, so
  # migrations run inside the app process via entrypoint.sh instead.
  app = "gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 1 --threads 4"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
