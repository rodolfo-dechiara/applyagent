[project]
name = "applyagent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2,<6",
    "pre-commit>=4.7.0",
    "pyrefly>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.pyrefly]
python-version = "3.13"
