<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}ApplyAgent{% endblock %}</title>
    <!-- No JS build step: Tailwind (Play CDN), HTMX 2, Alpine.js 3 via CDN only. -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"
    ></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <nav class="border-b border-slate-200 bg-white">
      <div
        class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3"
      >
        <a href="{% url 'core:dashboard' %}" class="text-lg font-bold"
          >ApplyAgent</a
        >
        {% if user.is_authenticated %}
          <div class="flex items-center gap-4 text-sm">
            <a href="{% url 'core:dashboard' %}" class="hover:underline"
              >Dashboard</a
            >
            <a href="{% url 'core:profile' %}" class="hover:underline"
              >My profile</a
            >
            <a href="{% url 'core:job_new' %}" class="hover:underline"
              >Paste a job</a
            >
            <span class="text-slate-500">{{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button
                type="submit"
                class="rounded bg-slate-200 px-2 py-1 hover:bg-slate-300"
              >
                Log out
              </button>
            </form>
          </div>
        {% else %}
          <div class="flex items-center gap-4 text-sm">
            <a href="{% url 'login' %}" class="hover:underline">Log in</a>
            <a href="{% url 'register' %}" class="hover:underline">Register</a>
          </div>
        {% endif %}
      </div>
    </nav>
    <main class="mx-auto max-w-3xl px-4 py-6">
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for message in messages %}
            <div
              class="rounded border px-3 py-2 text-sm {% if message.tags == 'error' %}border-red-300 bg-red-100 text-red-800{% elif message.tags == 'success' %}border-green-300 bg-green-100 text-green-800{% else %}border-blue-300 bg-blue-100 text-blue-800{% endif %}"
            >
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
