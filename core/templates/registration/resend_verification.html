{% extends "base.html" %}
{% block title %}Resend verification — ApplyAgent{% endblock %}
{% block content %}
  <h1 class="mb-4 text-2xl font-bold">Resend verification link</h1>
  <form method="post" class="max-w-sm space-y-4 rounded border border-slate-200 bg-white p-6 shadow-sm">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="mb-1 block text-sm font-medium" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="text-sm text-red-600">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">
      Send link
    </button>
  </form>
  <p class="mt-4 text-sm text-slate-500">
    <a href="{% url 'login' %}" class="underline">Back to log in</a>
  </p>
{% endblock %}
