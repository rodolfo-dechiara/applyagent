name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (ruff check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: types (pyrefly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pyrefly check

  tests:
    name: tests (migrate + manage.py test, demo mode)
    runs-on: ubuntu-latest
    # Deliberately no MISTRAL_API_KEY here: the whole suite runs in demo mode.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python manage.py migrate
      - run: uv run python manage.py test

  audit:
    name: audit (pip-audit on locked runtime deps, OWASP A06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv export --locked --no-dev --format requirements-txt --no-hashes -o requirements-lock.txt
      - run: uvx pip-audit --requirement requirements-lock.txt
