{% extends "base.html" %}
{% block title %}Password changed — ApplyAgent{% endblock %}
{% block content %}
  <div class="mx-auto max-w-md">
    <div
      class="mt-6 rounded-2xl border border-emerald-100 bg-white/80 p-8 text-center shadow-xl shadow-emerald-600/5 backdrop-blur"
    >
      <div
        class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-emerald-500 to-teal-500 text-2xl shadow-lg shadow-emerald-600/30"
      >
        ✓
      </div>
      <h1
        class="bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-2xl font-extrabold tracking-tight text-transparent"
      >
        Password changed
      </h1>
      <p class="mt-3 text-sm text-slate-600">Your password has been updated.</p>
      <p class="mt-5 text-sm">
        <a href="{% url 'login' %}" class="font-semibold text-indigo-600 hover:underline">Log in with your new password</a>
      </p>
    </div>
  </div>
{% endblock %}
