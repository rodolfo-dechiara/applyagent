# DKIM signing for outbound mail from youre-hired.eu.
# The private key arrives via the DKIM_PRIVATE_KEY secret (see entrypoint.sh);
# the matching public key is published as DNS TXT:
#   yh2026._domainkey.youre-hired.eu  "v=DKIM1; k=rsa; p=<base64 DER public key>"
Syslog                  yes
LogWhy                  yes
Canonicalization        relaxed/relaxed
Mode                    sv
UserID                  opendkim
Socket                  inet:8891@127.0.0.1
PidFile                 /var/run/opendkim/opendkim.pid
Domain                  youre-hired.eu
Selector                yh2026
KeyFile                 /etc/opendkim/keys/youre-hired.eu/yh2026.private
# Only sign mail arriving from Fly's private network / localhost (the web app
# connects over 6PN); anything else is passed through untouched.
InternalHosts           refile:/etc/opendkim/trusted.hosts
ExternalIgnoreList      refile:/etc/opendkim/trusted.hosts
