{% extends "base.html" %}
{% block title %}Reset link sent — ApplyAgent{% endblock %}
{% block content %}
  <div class="mx-auto w-full max-w-md">
    <div
      class="mt-6 rounded-2xl border border-indigo-100 bg-white/80 p-8 text-center shadow-xl shadow-indigo-600/5 backdrop-blur"
    >
      <div
        class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-indigo-500 to-fuchsia-500 text-2xl shadow-lg shadow-indigo-600/30"
      >
        ✉️
      </div>
      <h1
        class="bg-gradient-to-r from-indigo-600 to-fuchsia-600 bg-clip-text text-2xl font-extrabold tracking-tight text-transparent"
      >
        Check your inbox
      </h1>
      <p class="mt-3 text-sm leading-relaxed text-slate-600">
        If an account exists for that address, we've sent a password reset link.
        It expires after a short time and works once.
      </p>
      <p class="mt-5 text-sm text-slate-500">
        <a href="{% url 'login' %}" class="font-semibold text-indigo-600 hover:underline">Back to log in</a>
      </p>
    </div>
  </div>
{% endblock %}
