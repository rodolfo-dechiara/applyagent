# Fly app: applyagent-mail — a tiny relay-only Postfix + DKIM signer.
# Deliberately NO [services]/[[http_service]] block: no public IP is allocated,
# so the relay is reachable only from other apps in this org at
# applyagent-mail.internal:25 (Fly private 6PN). The applyagents app sends
# verification/reset emails through it.
app = "applyagent-mail"
primary_region = "fra"

[build]
  dockerfile = "deploy/mail/Dockerfile"

[env]
  MAIL_DOMAIN = "youre-hired.eu"

# Stays running (no auto-stop): it is infrastructure, not an HTTP app.
min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
